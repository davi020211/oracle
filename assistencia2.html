<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle - Assistência</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina assistencia-pagina">

    <div class="topo">
        <div class="logo">
            <img src="serafim.png" alt="Oracle">
            <h1>Oracle</h1>
        </div>

        
    </div>

    <div class="assistencia-conteudo">

        <a class="voltar" href="tela-principal.html">Voltar</a>

        <div class="assistencia-lista">

            <div class="assistencia-item">
                <input type="text" placeholder="pesquise as perguntas mais frequentes">
            </div>

            <div class="assistencia-item copiar">
                <span>whatsapp: (99) 9999999-9999 </span>
                <button class="botao-copiar" onclick="copiar('whatsapp: (99) 7777-9120')">copiar</button>
            </div>

            <div class="assistencia-item copiar">
                <span>email: oracle9999@gmail.com.fk (por favor não experimentar)</span>
                <button class="botao-copiar" onclick="copiar('oracle10@gmail.com.fk ')">copiar</button>
            </div>

            <div class="assistencia-item copiar">
                <span>telefone: 9999999-9999 </span>
                <button class="botao-copiar" onclick="copiar('9999999-9999')">copiar</button>
            </div>

        </div>
    </div>
</div>

<script>
function copiar(texto) {
    navigator.clipboard.writeText(texto);
}
</script>
</body>
</html>
