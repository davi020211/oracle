<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina">
    

    <div class="caixa-login">
        <div class="logo-grande">
            <img src="imagens/serafim.png" alt="Oracle">
            <div>
                <h1>Oracle</h1>
                <p>entrar na conta</p>
            </div>
        </div>

        <form class="formulario" action="tela-principal.html">
            <input class="campo" type="email" placeholder="email" required>
            <input class="campo" type="password" placeholder="senha" required>

            <div class="botoes">
                <button class="botao" type="submit">entrar</button>
                <a class="botao" href="criar-conta.html">criar conta</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
