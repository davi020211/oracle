<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle - Criar conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina criar">
    <div class="topo">
        <div></div>
        <a class="assistencia" href="assistencia.html">? assistência</a>
    </div>

    <div class="caixa-login">
        <div class="logo-grande">
            <img src="serafim.png" alt="Oracle">
            <div>
                <h1>Oracle</h1>
                <p>Criar conta</p>
            </div>
        </div>

        <form class="formulario" action="tela-principal.html">
            <input class="campo" type="email" placeholder="email" required>
            <input class="campo" type="password" placeholder="senha" required>
            <input class="campo" type="text" placeholder="enderço" required>
            <div class="botoes">
                <button class="botao" type="submit">Criar</button>
                <a class="botao" href="index.html">Voltar ao login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
